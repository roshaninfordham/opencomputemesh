# OpenComputeMesh edge configuration.
# Check it with: ocm -t --config examples/ocm.conf
# Apply changes with: ocm reload

network "Homelab mesh" {
    listen 8080;
    data_dir /var/lib/ocm;
    demo_mode on;
}

# A key an AI agent authenticates with.
token "agents" {
    allow_models qwen2.5:1.5b llama3.2:3b;
    budget 500 OCC;
    rate 60/min;
}

# What one shareable URL grants a visitor.
share "friends" {
    enroll node;
    expires 24h;
    grant 100 OCC;
    max_nodes 5;
}

# A shareable URL that only lets someone send requests.
share "viewers" {
    enroll request;
    expires 7d;
    max_nodes 0;
}

# Workers serving one exact model.
pool "small" {
    model qwen2.5:1.5b;
    policy expected_ms;
}

pool "medium" {
    model llama3.2:3b;
    policy fewest_active;
}

# HTTP surfaces. `auth token` requires a bearer key.
route "openai" {
    path /v1;
    pool small;
    auth token;
}

route "openai-medium" {
    path /v2;
    pool medium;
    auth token;
}
