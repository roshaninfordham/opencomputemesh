name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Coordinator and Python agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      # The real-Ollama test skips itself when no runtime is reachable.
      - run: uv run pytest -q -rs

  rust:
    name: Rust node agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: crates/ocm-node
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ocm-node
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  web:
    name: Web app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  workspace:
    name: Rust workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    name: Dependency licenses and advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  fuzz:
    name: Fuzz frame decoder and config parser (60s each)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # rust-toolchain.toml pins 1.99.0, and rustup lets that file win over the
      # installed default, so the job would otherwise build libFuzzer's
      # -Zsanitizer flags with a stable rustc. The variable also reaches the
      # `cargo build` that cargo-fuzz spawns, which `cargo +nightly` would not.
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # cargo-fuzz defaults to a musl target on Linux, whose static libc ASAN
      # refuses to link against; name the GNU target so the sanitizer build works.
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu decode_frame -- -max_total_time=60 -max_len=65536
      - run: cargo fuzz run --target x86_64-unknown-linux-gnu parse_config -- -max_total_time=60 -max_len=65536
