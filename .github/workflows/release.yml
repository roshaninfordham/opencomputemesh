name: Release

# Cut a release by pushing a tag: `git tag -a v0.1.3 -m "..." && git push origin v0.1.3`.
# Everything below then runs on native runners, which is the only way to produce
# real macOS and Windows artifacts: neither can be cross-compiled from Linux.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.1.3"
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  node:
    name: ocm-node (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, asset: macos-apple-silicon }
          - { os: macos-latest, target: x86_64-apple-darwin, asset: macos-intel }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, asset: windows-x64 }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, asset: linux-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/ocm-node
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        working-directory: crates/ocm-node
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          ext=""
          case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          mkdir -p dist
          # Name the download for the machine, not the Rust toolchain triple.
          cp "crates/ocm-node/target/${{ matrix.target }}/release/ocm-node${ext}" \
             "dist/ocm-node-${version}-${{ matrix.asset }}${ext}"
      - uses: actions/upload-artifact@v4
        with:
          name: ocm-node-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  python:
    name: Wheel (coordinator + ocm-agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build --wheel --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  web:
    name: Web bundle (runs on any device with a browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Zip
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p dist
          (cd web/dist && zip -qr "../../dist/opencomputemesh-web-${version}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [node, python, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Write release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          # Quoted heredoc: backticks must survive. An unquoted one runs them as commands
          # and silently strips every filename out of the notes.
          cat > release-notes.md <<'EOF'
          ## Which file do I need?

          **Hosting a network** — one machine with Python 3.12+. Download both:
          - `opencomputemesh-@VERSION@-py3-none-any.whl` (the coordinator and `ocm-agent`)
          - `opencomputemesh-web-@VERSION@.zip` (the web app the coordinator serves)

          **Sharing a machine's models** — download the one for your platform:

          | Your machine | Download |
          |---|---|
          | macOS on Apple silicon | `ocm-node-@VERSION@-macos-apple-silicon` |
          | macOS on Intel | `ocm-node-@VERSION@-macos-intel` |
          | Windows 64-bit | `ocm-node-@VERSION@-windows-x64.exe` |
          | Linux 64-bit | `ocm-node-@VERSION@-linux-x64` |

          **Just joining from a browser** — download nothing. Open the join link the host gave you.

          `SHA256SUMS.txt` verifies every download. The "Source code" archives are generated by
          GitHub for developers; they are not needed to run the mesh. Install steps are in the
          quick start, and the changes are in `CHANGELOG.md`.
          EOF
          sed -i "s/@VERSION@/${version}/g" release-notes.md
          test -s release-notes.md && grep -q "ocm-node-${version}-linux-x64" release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: false
          fail_on_unmatched_files: true
