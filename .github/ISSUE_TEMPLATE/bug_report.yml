name: Bug report
description: Something in the coordinator, agents or web app doesn't work as documented
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Coordinator, Python agent, Rust agent (ocm-node), Web app, Docs or scripts]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, settings (OCM_* values without secrets) and model used.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "OS, Python, Ollama version, browser"
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove join codes, tokens, credentials and any prompt text before pasting.
      render: text
