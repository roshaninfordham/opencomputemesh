<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"
     aria-label="OpenComputeMesh architecture. Requesters send a prompt to one coordinator, which holds credits, routes to a contributor machine that dials out, and settles a receipt. Contributor runtimes are Ollama, Superlinked SIE or any OpenAI-compatible server, Gemini, or an opted-in remote runtime. Tinfoil is the attested tier; Cognee is an owner-hosted memory seam outside the request path.">
  <title>OpenComputeMesh architecture</title>
  <desc>Colour marks the role: ink for core, violet for a runtime, amber for the attested tier, green for memory, slate for data and observability.</desc>
  <defs>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .h { font-size: 15px; font-weight: 700; fill: #15201d; }
      .k { font-size: 10px; font-weight: 700; letter-spacing: 1.2px; }
      .b { font-size: 12.5px; fill: #15201d; }
      .s { font-size: 11.5px; fill: #56645f; }
      .n { font-size: 11px; font-weight: 600; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #15201d; }
      .lbl { font-size: 10.5px; fill: #56645f; font-weight: 600; }
      .zone { fill: #ffffff; stroke: #d6ddda; stroke-width: 1.5; }
      .zoneInk { fill: #ffffff; stroke: #15201d; stroke-width: 2; }
      .chip { fill: #ffffff; stroke: #d6ddda; stroke-width: 1.5; }
      .wire { stroke: #2457d6; stroke-width: 2; fill: none; }
      .soft { stroke: #a3b0ab; stroke-width: 1.5; stroke-dasharray: 3 4; fill: none; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2457d6"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a3b0ab"/>
    </marker>
  </defs>
  <rect width="1280" height="800" rx="18" fill="#f3f5f3"/>

  <text x="40" y="42" class="t" font-size="21" font-weight="700" fill="#15201d">OpenComputeMesh</text>
  <text x="40" y="64" class="t s">One coordinator meters work it does not run. Colour is the role, not the vendor.</text>

  <!-- legend, top right -->
  <g class="t lbl">
    <rect x="742" y="30" width="12" height="12" rx="3" fill="#15201d"/><text x="760" y="40">core</text>
    <rect x="816" y="30" width="12" height="12" rx="3" fill="#6b46c1"/><text x="834" y="40">runtime</text>
    <rect x="906" y="30" width="12" height="12" rx="3" fill="#a35a14"/><text x="924" y="40">attested tier</text>
    <rect x="1014" y="30" width="12" height="12" rx="3" fill="#1d7449"/><text x="1032" y="40">memory</text>
    <rect x="1104" y="30" width="12" height="12" rx="3" fill="#56645f"/><text x="1122" y="40">data / errors</text>
  </g>

  <!-- zone 1: requesters -->
  <rect x="40" y="86" width="284" height="252" rx="14" class="zone"/>
  <text x="60" y="112" class="t h">Requesters</text>
  <text x="60" y="130" class="t s">no install, no compute shared</text>

  <rect x="56" y="144" width="252" height="76" rx="10" class="chip"/>
  <text x="72" y="168" class="t b" font-weight="600">Browser or phone</text>
  <text x="72" y="188" class="t s">join by link, pick a nickname</text>
  <text x="72" y="206" class="t s">tokens stream into the page</text>

  <rect x="56" y="232" width="252" height="76" rx="10" class="chip"/>
  <text x="72" y="256" class="t b" font-weight="600">API client</text>
  <text x="72" y="276" class="t m">/v1/chat/completions</text>
  <text x="72" y="294" class="t s">Bearer key, OpenAI shape</text>

  <text x="56" y="322" class="t lbl">HTTPS and WSS into the coordinator</text>

  <!-- wire requester -> coordinator -->
  <path d="M328 206 H344" class="wire" marker-end="url(#arrow)"/>

  <!-- zone 2: coordinator -->
  <rect x="348" y="86" width="400" height="252" rx="14" class="zoneInk"/>
  <text x="368" y="112" class="t h">Coordinator</text>
  <text x="368" y="130" class="t s">FastAPI, one process, the trust boundary</text>

  <g class="t n" fill="#15201d">
    <circle cx="377" cy="158" r="9" fill="#2457d6"/><text x="377" y="162" fill="#ffffff" text-anchor="middle" font-size="10">1</text>
    <text x="394" y="162" class="b">picks an online node serving that exact model</text>
  </g>
  <g class="t n" fill="#15201d">
    <circle cx="377" cy="188" r="9" fill="#2457d6"/><text x="377" y="192" fill="#ffffff" text-anchor="middle" font-size="10">2</text>
    <text x="394" y="192" class="b">holds worst-case credits, then routes</text>
  </g>
  <g class="t n" fill="#15201d">
    <circle cx="377" cy="218" r="9" fill="#2457d6"/><text x="377" y="222" fill="#ffffff" text-anchor="middle" font-size="10">3</text>
    <text x="394" y="222" class="b">tokens come back on the node's own socket</text>
  </g>
  <g class="t n" fill="#15201d">
    <circle cx="377" cy="248" r="9" fill="#2457d6"/><text x="377" y="252" fill="#ffffff" text-anchor="middle" font-size="10">4</text>
    <text x="394" y="252" class="b">receipt, settle the hold, balance the ledger</text>
  </g>

  <g class="t lbl">
    <rect x="368" y="272" width="112" height="24" rx="6" class="chip"/><text x="380" y="288">SQLite WAL</text>
    <rect x="488" y="272" width="122" height="24" rx="6" class="chip"/><text x="500" y="288">Tiger metrics</text>
    <rect x="618" y="272" width="110" height="24" rx="6" class="chip"/><text x="630" y="288">Sentry</text>
  </g>
  <text x="368" y="322" class="t s">Metrics and errors are optional and carry no prompts.</text>

  <!-- wire coordinator <-> agent -->
  <path d="M752 196 H768" class="wire" marker-end="url(#arrow)"/>
  <path d="M768 220 H752" class="wire" marker-end="url(#arrow)"/>
  <text x="762" y="182" class="t lbl" text-anchor="middle">WSS</text>

  <!-- zone 3: contributor -->
  <rect x="776" y="86" width="464" height="252" rx="14" class="zone"/>
  <text x="796" y="112" class="t h">Contributor machine</text>
  <text x="796" y="130" class="t s">dials out, opens no inbound ports</text>

  <rect x="792" y="142" width="432" height="52" rx="10" class="chip"/>
  <text x="808" y="165" class="t b" font-weight="600">ocm-agent (Python) or ocm-node (Rust)</text>
  <text x="808" y="183" class="t s">owner approves models; can pause or revoke</text>

  <text x="792" y="214" class="t lbl">one RuntimeAdapter interface</text>

  <rect x="792" y="222" width="208" height="44" rx="8" fill="#f4f0fd" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="806" y="241" class="t b" font-weight="600" font-size="12">Ollama</text>
  <text x="806" y="257" class="t s" font-size="10.5">default &#183; loopback only</text>

  <rect x="1016" y="222" width="208" height="44" rx="8" fill="#f4f0fd" stroke="#6b46c1" stroke-width="2"/>
  <text x="1030" y="241" class="t" font-weight="600" font-size="12" fill="#4c2f96">SIE &#183; any OpenAI-compatible</text>
  <text x="1030" y="257" class="t s" font-size="10.5">vLLM, LM Studio, llama.cpp, TGI</text>

  <rect x="792" y="274" width="208" height="44" rx="8" fill="#f4f0fd" stroke="#6b46c1" stroke-width="1.5"/>
  <text x="806" y="293" class="t b" font-weight="600" font-size="12">Gemini API</text>
  <text x="806" y="309" class="t s" font-size="10.5">key stays on the node</text>

  <rect x="1016" y="274" width="208" height="44" rx="8" fill="#f4f0fd" stroke="#6b46c1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1030" y="293" class="t b" font-weight="600" font-size="12">Remote runtime</text>
  <text x="1030" y="309" class="t s" font-size="10.5">opt-in &#183; attested: false</text>

  <text x="792" y="332" class="t s">A runtime off the node is refused unless the owner opts in.</text>

  <!-- part four: third party pieces -->
  <text x="40" y="376" class="t h">Third-party pieces: what each one is for</text>
  <text x="40" y="396" class="t s">Nothing is vendored. Each is reached over an interface, so the mesh still runs when one is absent.</text>

  <g>
    <!-- SIE -->
    <rect x="40" y="412" width="384" height="272" rx="12" fill="#ffffff" stroke="#e2dcf7" stroke-width="1.5"/>
    <rect x="40" y="412" width="384" height="6" rx="3" fill="#6b46c1"/>
    <text x="60" y="442" class="t k" fill="#6b46c1">RUNTIME</text>
    <text x="60" y="468" class="t" font-size="19" font-weight="700" fill="#15201d">Superlinked SIE</text>
    <text x="404" y="442" class="t lbl" text-anchor="end">used by the contributor</text>
    <text x="60" y="492" class="t s">Serves chat completions from the contributor's</text>
    <text x="60" y="509" class="t s">own server. The agent speaks its OpenAI API.</text>
    <text x="60" y="533" class="t k" fill="#56645f">HOW</text>
    <text x="60" y="551" class="t m">ocm-agent --runtime openai</text>
    <text x="60" y="574" class="t k" fill="#56645f">VERIFIED</text>
    <text x="60" y="592" class="t s">Mock-transport tests, plus a live run against an</text>
    <text x="60" y="609" class="t s">OpenAI-compatible server through the real</text>
    <text x="60" y="631" class="t k" fill="#a35a14">NOT YET</text>
    <text x="60" y="647" class="t s">coordinator, agent and ledger. Chat only: no</text>
    <text x="60" y="663" class="t s">embeddings or rerank, and no digest on model ids.</text>

    <!-- Tinfoil -->
    <rect x="448" y="412" width="384" height="272" rx="12" fill="#ffffff" stroke="#f0e0cc" stroke-width="1.5"/>
    <rect x="448" y="412" width="384" height="6" rx="3" fill="#a35a14"/>
    <text x="468" y="442" class="t k" fill="#a35a14">ATTESTATION TIER</text>
    <text x="468" y="468" class="t" font-size="19" font-weight="700" fill="#15201d">Tinfoil</text>
    <text x="812" y="442" class="t lbl" text-anchor="end">used by the coordinator</text>
    <text x="468" y="492" class="t s">A gateway pins one enclave and forwards the</text>
    <text x="468" y="509" class="t s">request, so a receipt can say what ran.</text>
    <text x="468" y="533" class="t k" fill="#56645f">HOW</text>
    <text x="468" y="551" class="t m">tools/tinfoil-gateway</text>
    <text x="468" y="574" class="t k" fill="#56645f">VERIFIED</text>
    <text x="468" y="592" class="t s">Smoke-tested against a live enclave with the</text>
    <text x="468" y="609" class="t s">fingerprint pinned; the probe verifies it.</text>
    <text x="468" y="631" class="t k" fill="#a35a14">NOT YET</text>
    <text x="468" y="647" class="t s">Not deployed: needs our Tinfoil org. A laptop</text>
    <text x="468" y="663" class="t s">can never be attested, and is labelled so.</text>

    <!-- Cognee -->
    <rect x="856" y="412" width="384" height="272" rx="12" fill="#ffffff" stroke="#d8e8df" stroke-width="1.5"/>
    <rect x="856" y="412" width="384" height="6" rx="3" fill="#1d7449"/>
    <text x="876" y="442" class="t k" fill="#1d7449">MEMORY SEAM</text>
    <text x="876" y="468" class="t" font-size="19" font-weight="700" fill="#15201d">Cognee</text>
    <text x="1220" y="442" class="t lbl" text-anchor="end">not in the request path</text>
    <text x="876" y="492" class="t s">An owner-hosted knowledge graph read over</text>
    <text x="876" y="509" class="t s">HTTP. The coordinator never imports it.</text>
    <text x="876" y="533" class="t k" fill="#56645f">HOW</text>
    <text x="876" y="551" class="t m">ocm/memory.py &#183; fixed dataset</text>
    <text x="876" y="574" class="t k" fill="#56645f">VERIFIED</text>
    <text x="876" y="592" class="t s">11 tests: scope cannot escape, errors and repr</text>
    <text x="876" y="609" class="t s">carry no content. Ran keyless locally.</text>
    <text x="876" y="631" class="t k" fill="#a35a14">NOT YET</text>
    <text x="876" y="647" class="t s">Not in the job path: no request is served</text>
    <text x="876" y="663" class="t s">differently because memory exists.</text>
  </g>

  <!-- footer: what a request costs -->
  <rect x="40" y="700" width="1200" height="76" rx="12" fill="#15201d"/>
  <text x="64" y="730" class="t" font-size="11" font-weight="700" letter-spacing="1.2" fill="#9fb0aa">WHAT THE RECEIPT PROVES</text>
  <text x="64" y="754" class="t" font-size="13" fill="#ffffff">Tokens and timings come from the runtime, coordinator or browser, labelled by source. The charge never exceeds the hold. Every debit has a matching reward.</text>
</svg>
