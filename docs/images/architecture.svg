<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="OpenComputeMesh architecture: browsers and API clients talk to one coordinator; node agents connect outbound and run models through pluggable runtime adapters">
  <title>OpenComputeMesh architecture</title>
  <defs>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .h { font-size: 17px; font-weight: 700; fill: #15201d; }
      .b { font-size: 13px; fill: #15201d; }
      .s { font-size: 12px; fill: #56645f; }
      .lbl { font-size: 12px; fill: #2457d6; font-weight: 600; }
      .box { fill: #ffffff; stroke: #d6ddda; stroke-width: 2; }
      .ok { fill: #ffffff; stroke: #1d7449; stroke-width: 2; }
      .cred { fill: #ffffff; stroke: #a35a14; stroke-width: 2; stroke-dasharray: 7 5; }
      .ext { fill: #f3f5f3; stroke: #a3b0ab; stroke-width: 1.5; stroke-dasharray: 2 5; }
      .wire { stroke: #2457d6; stroke-width: 2.5; fill: none; }
      .soft { stroke: #a3b0ab; stroke-width: 2; fill: none; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2457d6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a3b0ab"/>
    </marker>
  </defs>
  <rect width="1280" height="640" rx="20" fill="#f3f5f3"/>

  <!-- column headings -->
  <g class="t s">
    <text x="60" y="48">People</text>
    <text x="400" y="48">One coordinator (trust and accounting boundary)</text>
    <text x="900" y="48">Contributors' machines (no inbound ports)</text>
  </g>

  <!-- clients -->
  <rect x="40" y="70" width="270" height="96" rx="14" class="ok"/>
  <text x="60" y="102" class="t h">Browser (phone or laptop)</text>
  <text x="60" y="126" class="t b">Join by QR, run a prompt,</text>
  <text x="60" y="146" class="t b">watch tokens stream, read receipts</text>

  <rect x="40" y="190" width="270" height="80" rx="14" class="ok"/>
  <text x="60" y="222" class="t h">API clients</text>
  <text x="60" y="246" class="t b">OpenAI-style /v1/chat/completions</text>

  <!-- coordinator -->
  <rect x="380" y="70" width="440" height="330" rx="16" class="ok"/>
  <text x="404" y="104" class="t h">Coordinator: FastAPI, one process</text>
  <g class="t b">
    <text x="404" y="134">Join and sessions, origin checks, rate limits</text>
    <text x="404" y="158">Scheduler: exact model, online, least busy</text>
    <text x="404" y="182">Job state machine, retries, cancel, timeouts</text>
    <text x="404" y="206">Metrics with provenance (runtime, coordinator, browser)</text>
    <text x="404" y="230">Credits: reserve, settle, release (micro-OCC)</text>
  </g>

  <!-- storage + observability inside coordinator column -->
  <rect x="404" y="252" width="190" height="62" rx="10" class="ok"/>
  <text x="418" y="276" class="t b" font-weight="600">SQLite (WAL)</text>
  <text x="418" y="296" class="t s">jobs + append-only ledger</text>

  <rect x="606" y="252" width="190" height="62" rx="10" class="ok"/>
  <text x="620" y="276" class="t b" font-weight="600">Tiger Data</text>
  <text x="620" y="296" class="t s">TimescaleDB, verified locally</text>

  <rect x="404" y="324" width="190" height="62" rx="10" class="cred"/>
  <text x="418" y="348" class="t b" font-weight="600">Sentry</text>
  <text x="418" y="368" class="t s">errors, prompts scrubbed</text>

  <rect x="606" y="324" width="190" height="62" rx="10" class="ext"/>
  <text x="620" y="348" class="t b" font-weight="600">Postgres ledger</text>
  <text x="620" y="368" class="t s">extension point</text>

  <!-- node agents -->
  <rect x="890" y="70" width="350" height="110" rx="14" class="ok"/>
  <text x="910" y="102" class="t h">Node agent (Python or Rust)</text>
  <text x="910" y="126" class="t b">Owner approves models, pause or revoke</text>
  <text x="910" y="146" class="t b">Outbound WSS only, single-use enrollment,</text>
  <text x="910" y="166" class="t b">credential stored 0600</text>

  <!-- runtimes -->
  <text x="890" y="222" class="t s">Runtime adapters (one interface)</text>
  <rect x="890" y="236" width="168" height="66" rx="10" class="ok"/>
  <text x="906" y="262" class="t b" font-weight="600">Ollama</text>
  <text x="906" y="282" class="t s">127.0.0.1 only</text>

  <rect x="1072" y="236" width="168" height="66" rx="10" class="cred"/>
  <text x="1088" y="262" class="t b" font-weight="600">Gemini API</text>
  <text x="1088" y="279" class="t s">Python agent only</text>
  <text x="1088" y="295" class="t s">key stays on node</text>

  <rect x="890" y="316" width="350" height="56" rx="10" class="ext"/>
  <text x="906" y="340" class="t b" font-weight="600">llama.cpp, vLLM, MLX, OpenAI-compatible</text>
  <text x="906" y="358" class="t s">extension points behind the same adapter</text>

  <!-- wires -->
  <path d="M310 118 H372" class="wire" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="318" y="108" class="t lbl">HTTPS + WSS</text>
  <path d="M310 230 H372" class="wire" marker-end="url(#a)"/>
  <text x="326" y="222" class="t lbl">HTTPS</text>

  <path d="M886 125 H828" class="wire" marker-end="url(#a)"/>
  <text x="834" y="116" class="t lbl">WSS</text>

  <path d="M1200 180 V228" class="soft" marker-end="url(#g)"/>

  <!-- request story -->
  <g transform="translate(40 430)">
    <text x="0" y="0" class="t h">What one request does</text>
    <g class="t b">
      <text x="0" y="30">1. You pick a model that an online node is actually serving and send a prompt.</text>
      <text x="0" y="54">2. The coordinator places a worst-case credit hold and routes to the least busy eligible node.</text>
      <text x="0" y="78">3. The node's agent calls its runtime (Ollama on loopback, or the Gemini API) and streams tokens back over its outbound socket.</text>
      <text x="0" y="102">4. The receipt shows runtime-reported tokens and timings. You pay the measured cost (capped at the hold) and the owner earns the same.</text>
    </g>
  </g>

  <!-- legend -->
  <g transform="translate(900 430)">
    <text x="0" y="0" class="t h">Status</text>
    <rect x="0" y="16" width="34" height="20" rx="5" class="ok"/>
    <text x="46" y="31" class="t b">Built and verified end to end</text>
    <rect x="0" y="48" width="34" height="20" rx="5" class="cred"/>
    <text x="46" y="63" class="t b">Built and tested; live run needs credentials</text>
    <rect x="0" y="80" width="34" height="20" rx="5" class="ext"/>
    <text x="46" y="95" class="t b">Extension point, not built</text>
    <text x="0" y="132" class="t s">Snowflake and Nimble: no integration.</text>
  </g>
</svg>
