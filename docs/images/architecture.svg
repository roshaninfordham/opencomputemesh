<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="950" viewBox="0 0 1280 950" role="img" aria-label="OpenComputeMesh architecture: browsers and API clients talk to one coordinator that schedules jobs, records receipts and moves credits; Python and Rust node agents dial out and run models through one runtime interface covering local Ollama, any OpenAI-compatible server such as SIE, an opted-in remote runtime and Gemini; an optional Tinfoil attested tier sits behind the coordinator, and Cognee memory is an owner-hosted seam outside it">
  <title>OpenComputeMesh architecture</title>
  <defs>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .h { font-size: 17px; font-weight: 700; fill: #15201d; }
      .b { font-size: 13px; fill: #15201d; }
      .s { font-size: 12px; fill: #56645f; }
      .m { font-size: 12px; fill: #15201d; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .lbl { font-size: 12px; fill: #2457d6; font-weight: 600; }
      .ok { fill: #ffffff; stroke: #1d7449; stroke-width: 2; }
      .cred { fill: #ffffff; stroke: #a35a14; stroke-width: 2; stroke-dasharray: 7 5; }
      .ext { fill: #f3f5f3; stroke: #a3b0ab; stroke-width: 1.5; stroke-dasharray: 2 5; }
      .wire { stroke: #2457d6; stroke-width: 2.5; fill: none; }
      .soft { stroke: #a3b0ab; stroke-width: 2; fill: none; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#2457d6"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#a3b0ab"/>
    </marker>
  </defs>
  <rect width="1280" height="950" rx="20" fill="#f3f5f3"/>

  <g class="t s">
    <text x="42" y="46">People (any device)</text>
    <text x="362" y="46">One coordinator (trust and accounting boundary)</text>
    <text x="882" y="46">Contributors' machines (no inbound ports)</text>
  </g>

  <!-- people -->
  <rect x="40" y="66" width="272" height="104" rx="14" class="ok"/>
  <text x="60" y="98" class="t h">Browser, phone or laptop</text>
  <text x="60" y="122" class="t b">Join by QR or link, run a prompt,</text>
  <text x="60" y="142" class="t b">watch tokens stream, read receipts</text>
  <text x="60" y="160" class="t s">No install, no compute shared</text>

  <rect x="40" y="190" width="272" height="80" rx="14" class="ok"/>
  <text x="60" y="222" class="t h">API clients</text>
  <text x="60" y="246" class="t b">OpenAI-style /v1/chat/completions</text>

  <rect x="40" y="290" width="272" height="72" rx="14" class="ext"/>
  <text x="60" y="320" class="t b" font-weight="600">Desktop app (Tauri)</text>
  <text x="60" y="340" class="t s">roadmap, not built</text>

  <!-- coordinator -->
  <rect x="360" y="66" width="472" height="336" rx="16" class="ok"/>
  <text x="384" y="100" class="t h">Coordinator: FastAPI, one process</text>
  <g class="t b">
    <text x="384" y="128">Join and sessions, origin checks, rate limits</text>
    <text x="384" y="150">Scheduler: exact model, online, least busy</text>
    <text x="384" y="172">Job state machine, retries, cancel, timeouts</text>
    <text x="384" y="194">Receipts: runtime-reported tokens and timings</text>
    <text x="384" y="216">Credits: reserve, settle, release (micro-OCC)</text>
  </g>
  <rect x="382" y="234" width="212" height="58" rx="10" class="ok"/>
  <text x="396" y="257" class="t b" font-weight="600">SQLite (WAL)</text>
  <text x="396" y="277" class="t s">jobs + append-only ledger</text>

  <rect x="606" y="234" width="208" height="58" rx="10" class="ok"/>
  <text x="620" y="257" class="t b" font-weight="600">Tiger Data</text>
  <text x="620" y="277" class="t s">TimescaleDB, built</text>

  <rect x="382" y="304" width="212" height="58" rx="10" class="cred"/>
  <text x="396" y="327" class="t b" font-weight="600">Sentry</text>
  <text x="396" y="347" class="t s">errors, prompts scrubbed</text>

  <rect x="606" y="304" width="208" height="58" rx="10" class="ok"/>
  <text x="620" y="327" class="t b" font-weight="600">Decision export</text>
  <text x="620" y="347" class="t m">ocm export-decisions</text>

  <text x="382" y="386" class="t s">One process owns live sockets and in-flight tokens.</text>

  <!-- confidential tier -->
  <rect x="360" y="428" width="472" height="94" rx="14" class="cred"/>
  <text x="384" y="458" class="t h">Confidential tier: Tinfoil gateway</text>
  <text x="384" y="482" class="t b">Stateless proxy to an attested enclave; fingerprint pinned.</text>
  <text x="384" y="502" class="t s">Verified against a live enclave. Not deployed: needs our Tinfoil org.</text>

  <!-- agents -->
  <rect x="880" y="66" width="362" height="104" rx="14" class="ok"/>
  <text x="900" y="98" class="t h">Python agent (ocm-agent)</text>
  <text x="900" y="122" class="t b">Approves models, pause or revoke</text>
  <text x="900" y="142" class="t b">Outbound WSS, single-use enrollment,</text>
  <text x="900" y="160" class="t b">credential stored 0600</text>

  <rect x="880" y="186" width="362" height="104" rx="14" class="ok"/>
  <text x="900" y="218" class="t h">Rust node (ocm-node)</text>
  <text x="900" y="242" class="t b">Single binary, same flags and state file</text>
  <text x="900" y="262" class="t b">macOS ARM and Intel, Windows, Linux</text>
  <text x="900" y="280" class="t s">Ollama runtime only, no --runtime</text>

  <text x="880" y="316" class="t s">Runtime adapters (one interface)</text>
  <rect x="880" y="330" width="172" height="66" rx="10" class="ok"/>
  <text x="896" y="356" class="t b" font-weight="600">Ollama</text>
  <text x="896" y="376" class="t s">127.0.0.1 only by default</text>

  <rect x="1070" y="330" width="172" height="66" rx="10" class="cred"/>
  <text x="1086" y="356" class="t b" font-weight="600">Gemini API</text>
  <text x="1086" y="374" class="t s">Python agent only,</text>
  <text x="1086" y="390" class="t s">key stays on the node</text>

  <rect x="880" y="412" width="362" height="76" rx="10" class="ok"/>
  <text x="896" y="436" class="t b" font-weight="600">OpenAI-compatible server --runtime openai</text>
  <text x="896" y="456" class="t b">Superlinked SIE, vLLM, LM Studio, llama.cpp, TGI</text>
  <text x="896" y="474" class="t s">Same loopback rule; model ids have no digest</text>

  <rect x="880" y="504" width="362" height="66" rx="10" class="cred"/>
  <text x="896" y="530" class="t b" font-weight="600">Remote runtime (opt-in)</text>
  <text x="896" y="550" class="t s">--allow-remote-runtime, probed once,</text>
  <text x="896" y="564" class="t s">labelled attested: false</text>

  <rect x="880" y="586" width="362" height="66" rx="10" class="ext"/>
  <text x="896" y="612" class="t b" font-weight="600">Cognee memory (owner-hosted)</text>
  <text x="896" y="632" class="t s">Client seam tested; not in the job path,</text>
  <text x="896" y="646" class="t s">never inside the coordinator</text>

  <!-- wires -->
  <path d="M312 118 H352" class="wire" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="318" y="108" class="t lbl">HTTPS + WSS</text>
  <path d="M312 230 H352" class="wire" marker-end="url(#a)"/>
  <text x="326" y="222" class="t lbl">HTTPS</text>
  <path d="M876 120 H836" class="wire" marker-end="url(#a)"/>
  <text x="840" y="110" class="t lbl">WSS</text>
  <path d="M876 240 H836" class="wire" marker-end="url(#a)"/>
  <text x="840" y="230" class="t lbl">WSS</text>
  <path d="M1062 290 V326" class="soft" marker-end="url(#g)"/>
  <path d="M596 402 V424" class="soft" marker-end="url(#g)"/>

  <!-- request story -->
  <g transform="translate(40 700)">
    <text x="0" y="0" class="t h">What one request does</text>
    <g class="t b">
      <text x="0" y="30">1. Pick a model an online node is actually serving, then send a prompt from a browser or the API.</text>
      <text x="0" y="54">2. The coordinator places a worst-case credit hold and routes to the least busy eligible node.</text>
      <text x="0" y="78">3. That node's agent calls whichever runtime it was started with: Ollama, SIE or another</text>
      <text x="0" y="102">    OpenAI-compatible server, an opted-in remote runtime, or Gemini. Tokens stream back over its socket.</text>
      <text x="0" y="126">4. The receipt carries runtime-reported tokens and timings with provenance; you pay the measured cost,</text>
      <text x="0" y="150">    capped at the hold, and the owner earns the same.</text>
    </g>
  </g>

  <!-- legend -->
  <g transform="translate(880 700)">
    <text x="0" y="0" class="t h">Status</text>
    <rect x="0" y="16" width="34" height="20" rx="5" class="ok"/>
    <text x="46" y="31" class="t b">Built and verified end to end</text>
    <rect x="0" y="48" width="34" height="20" rx="5" class="cred"/>
    <text x="46" y="63" class="t b">Built and tested; live run needs credentials or hardware</text>
    <rect x="0" y="80" width="34" height="20" rx="5" class="ext"/>
    <text x="46" y="95" class="t b">Extension point or roadmap, not shipped</text>
    <text x="0" y="132" class="t s">Snowflake and Nimble: no integration.</text>
  </g>

  <!-- third-party placement -->
  <g transform="translate(40 876)">
    <text x="0" y="0" class="t h">Where the third-party pieces sit</text>
    <text x="0" y="24" class="t b">Superlinked SIE is a node-local runtime behind --runtime openai. Apache-2.0, not vendored: the agent calls its HTTP API.</text>
    <text x="0" y="46" class="t b">Tinfoil is the optional attested tier. Cognee is an owner-hosted memory seam, outside the coordinator and not yet in the job path.</text>
  </g>
</svg>
