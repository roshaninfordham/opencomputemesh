<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img"
     aria-label="OpenComputeMesh: share compute, run models, see every token">
  <title>OpenComputeMesh: share compute, run models, see every token</title>
  <defs>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>
  <rect width="1280" height="360" rx="20" fill="#f3f5f3"/>

  <g transform="translate(72 74) scale(2.4)">
    <path d="M6 6L26 6L16 26Z" stroke="#15201d" stroke-width="2" stroke-linejoin="round" fill="none"/>
    <g fill="#2457d6"><circle cx="6" cy="6" r="4"/><circle cx="26" cy="6" r="4"/><circle cx="16" cy="26" r="4"/></g>
  </g>
  <text x="162" y="120" class="t" font-size="44" font-weight="700" fill="#15201d" letter-spacing="-1">OpenComputeMesh</text>

  <text x="74" y="176" class="t" font-size="26" font-weight="600" fill="#15201d">Share compute. Run models. See every token.</text>
  <text x="74" y="210" class="t" font-size="16.5" fill="#56645f">One coordinator routes a prompt to a machine that already serves that model,</text>
  <text x="74" y="234" class="t" font-size="16.5" fill="#56645f">then settles credits from what the runtime reported. Requesters install nothing.</text>

  <g class="t" font-size="12.5" font-weight="600">
    <rect x="74" y="262" width="206" height="30" rx="15" fill="#f4f0fd" stroke="#6b46c1" stroke-width="1.5"/>
    <text x="90" y="282" fill="#4c2f96">Ollama or any OpenAI server</text>
    <rect x="292" y="262" width="166" height="30" rx="15" fill="#ffffff" stroke="#d6ddda" stroke-width="1.5"/>
    <text x="306" y="282" fill="#15201d">Python + Rust agents</text>
    <rect x="470" y="262" width="190" height="30" rx="15" fill="#ffffff" stroke="#d6ddda" stroke-width="1.5"/>
    <text x="484" y="282" fill="#15201d">receipts with provenance</text>
  </g>

  <!-- colour-coded mesh -->
  <g transform="translate(760 36)">
    <path d="M150 150 L60 70" stroke="#6b46c1" stroke-width="2.5" fill="none"/>
    <path d="M250 150 L350 70" stroke="#a35a14" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>
    <path d="M150 150 L60 236" stroke="#1d7449" stroke-width="2.5" fill="none" stroke-dasharray="2 6"/>

    <rect x="120" y="120" width="160" height="60" rx="12" fill="#15201d"/>
    <text x="200" y="146" class="t" font-size="13" font-weight="600" fill="#ffffff" text-anchor="middle">coordinator</text>
    <text x="200" y="164" class="t" font-size="10.5" fill="#c9d3cf" text-anchor="middle">route &#183; meter &#183; settle</text>

    <circle cx="60" cy="70" r="30" fill="#f4f0fd" stroke="#6b46c1" stroke-width="2.5"/>
    <text x="60" y="67" class="t" font-size="10" font-weight="700" fill="#4c2f96" text-anchor="middle">runtime</text>
    <text x="60" y="80" class="t" font-size="9" fill="#56645f" text-anchor="middle">SIE, vLLM</text>

    <circle cx="350" cy="70" r="30" fill="#fdf4e8" stroke="#a35a14" stroke-width="2.5" stroke-dasharray="5 3"/>
    <text x="350" y="67" class="t" font-size="10" font-weight="700" fill="#8a4c10" text-anchor="middle">Tinfoil</text>
    <text x="350" y="80" class="t" font-size="9" fill="#56645f" text-anchor="middle">attested</text>

    <circle cx="60" cy="236" r="30" fill="#eef6f1" stroke="#1d7449" stroke-width="2.5" stroke-dasharray="2 4"/>
    <text x="60" y="233" class="t" font-size="10" font-weight="700" fill="#185f3c" text-anchor="middle">Cognee</text>
    <text x="60" y="246" class="t" font-size="9" fill="#56645f" text-anchor="middle">memory</text>

    <rect x="252" y="126" width="150" height="24" rx="12" fill="#e6ecfb"/>
    <text x="327" y="142" class="m" font-size="10.5" fill="#2457d6" text-anchor="middle">tokens &#183; ms &#183; credits</text>
  </g>
</svg>
