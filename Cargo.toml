[workspace]
resolver = "3"
members = ["crates/ocm-proto", "crates/ocm-sched"]
exclude = ["crates/ocm-node", "fuzz"]

[workspace.package]
version = "0.2.0-alpha.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/roshaninfordham/opencomputemesh"

[workspace.dependencies]
ocm-proto = { path = "crates/ocm-proto" }
ocm-sched = { path = "crates/ocm-sched" }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["fast", "zeroize"] }
getrandom = { version = "0.3", default-features = false }
proptest = { version = "1.12", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
